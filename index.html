<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>링크 매핑 도구</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        .count-badge {
            font-size: 0.9rem;
            color: #007bff;
            background-color: #e6f2ff;
            padding: 2px 8px;
            border-radius: 12px;
        }
        textarea, input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            font-family: 'Pretendard', sans-serif;
        }
        textarea {
            height: 220px;
            resize: vertical;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 10px;
            font-family: 'Pretendard', sans-serif;
        }
        button:hover {
            background-color: #0056b3;
        }
        .copy-btn {
            background-color: #28a745;
        }
        .copy-btn:hover {
            background-color: #218838;
        }
        .result-box {
            margin-top: 10px;
            padding: 15px;
            background-color: #eef2f5;
            border-radius: 6px;
            word-break: break-all;
            line-height: 1.8;
            font-size: 1.1rem;
            min-height: 50px;
        }
        .result-box a {
            color: #007bff;
            text-decoration: none;
            margin: 0 2px;
        }
        .result-box a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<h1>텍스트-링크 매핑 생성기</h1>
    
<div class="container">
    
    
    <div class="form-group">
        <label for="linksInput">
            <span>1. 링크 목록 (줄바꿈으로 구분)</span>
            <span class="count-badge">현재 <span id="linkCount">0</span>줄</span>
        </label>
        <textarea id="linksInput" oninput="updateCounts()"></textarea>
    </div>

    <div class="form-group">
        <label for="textInput">
            <span>2. 텍스트 입력</span>
            <span class="count-badge">현재 <span id="textCount">0</span>자</span>
        </label>
        <input type="text" id="textInput" oninput="updateCounts()">
    </div>

    <button onclick="generateLinks()">변환하기</button>

    <div class="form-group" style="margin-top: 25px;">
        <label>
            <span>3. 결과 출력</span>
            <button class="copy-btn" style="width: auto; padding: 6px 12px; margin: 0; font-size: 0.9rem;" onclick="copyResult()">결과 복사하기</button>
        </label>
        <div id="result" class="result-box"></div>
    </div>
</div>

<script>
    function updateCounts() {
        // 링크 개수 카운트
        const linksRaw = document.getElementById('linksInput').value;
        const links = linksRaw.split('\n').filter(link => link.trim().length > 0);
        document.getElementById('linkCount').textContent = links.length;

        // 텍스트 글자수 카운트
        const textRaw = document.getElementById('textInput').value;
        document.getElementById('textCount').textContent = textRaw.length;
    }

    function generateLinks() {
        const linksRaw = document.getElementById('linksInput').value;
        const textRaw = document.getElementById('textInput').value;
        const resultContainer = document.getElementById('result');

        const links = linksRaw.split('\n')
                              .map(link => link.trim())
                              .filter(link => link.length > 0);

        const characters = textRaw.split('');

        if (characters.length === 0) {
            resultContainer.innerHTML = '<span style="color:red; font-size:0.9rem;">텍스트를 입력해주세요.</span>';
            return;
        }

        let outputHTML = '';

        characters.forEach((char, index) => {
            if (index < links.length) {
                let url = links[index];
                if (!/^https?:\/\//i.test(url)) {
                    url = 'http://' + url;
                }
                outputHTML += `<a href="${url}" target="_blank">${char}</a>`;
            } else {
                outputHTML += char;
            }
        });

        resultContainer.innerHTML = outputHTML;
    }

    function copyResult() {
        const resultContainer = document.getElementById('result');
        
        if (resultContainer.innerText.trim() === '' || resultContainer.innerText.includes('텍스트를 입력해주세요')) {
            alert('복사할 결과물이 없습니다.');
            return;
        }

        const range = document.createRange();
        range.selectNode(resultContainer);
        window.getSelection().removeAllRanges();
        window.getSelection().addRange(range);

        try {
            document.execCommand('copy');
            alert('결과가 복사되었습니다. (Ctrl+V로 붙여넣기 하세요)');
        } catch (err) {
            alert('복사에 실패했습니다.');
        }

        window.getSelection().removeAllRanges();
    }
</script>

</body>
</html>
