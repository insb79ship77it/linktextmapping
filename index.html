<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>링크 매핑 도구</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        .count-badge {
            font-size: 0.85rem;
            color: #007bff;
            background-color: #e6f2ff;
            padding: 3px 10px;
            border-radius: 12px;
        }
        textarea, input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            font-family: 'Pretendard', sans-serif;
        }
        textarea {
            height: 200px;
            resize: vertical;
        }
        .source-textarea {
            height: 100px;
            font-family: monospace;
            font-size: 0.9rem;
            background-color: #f8f9fa;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 10px;
            font-family: 'Pretendard', sans-serif;
        }
        button:hover {
            background-color: #0056b3;
        }
        .copy-btn {
            background-color: #28a745;
        }
        .copy-btn:hover {
            background-color: #218838;
        }
        .copy-btn-alt {
            background-color: #17a2b8;
        }
        .copy-btn-alt:hover {
            background-color: #138496;
        }
        .result-box {
            margin-top: 10px;
            padding: 15px;
            background-color: #eef2f5;
            border-radius: 6px;
            word-break: break-all;
            line-height: 1.8;
            font-size: 1.1rem;
            min-height: 50px;
            white-space: pre-wrap;
        }
        .result-box a {
            color: #007bff;
            text-decoration: none;
        }
        .result-box a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<h1>텍스트-링크 매핑 생성기</h1>

<div class="container">
    <div class="form-group">
        <label for="linksInput">
            <span>1. 링크 목록 (줄바꿈으로 구분)</span>
            <span class="count-badge">현재 <span id="linkCount">0</span>줄</span>
        </label>
        <textarea id="linksInput" oninput="updateCounts()"></textarea>
    </div>

    <div class="form-group">
        <label for="textInput">
            <span>2. 텍스트 입력</span>
            <span class="count-badge">공백 포함 <span id="textCount">0</span>자 / 공백 제외 <span id="textCountNoSpace">0</span>자</span>
        </label>
        <input type="text" id="textInput" oninput="updateCounts()">
    </div>

    <button onclick="generateLinks()">변환하기</button>

    <!-- HTML 소스 출력 및 수정 영역 -->
    <div class="form-group" style="margin-top: 25px;">
        <label for="htmlSource">
            <span>3. HTML 소스 (수정 가능)</span>
            <button class="copy-btn" style="width: auto; padding: 5px 10px; margin: 0; font-size: 0.85rem;" onclick="copyHtmlSource()">HTML 소스 복사</button>
        </label>
        <textarea id="htmlSource" class="source-textarea" placeholder="변환하기 버튼을 누르면 HTML 소스가 생성됩니다." oninput="renderFromSource()"></textarea>
    </div>

    <!-- 최종 결과 미리보기 영역 -->
    <div class="form-group">
        <label>
            <span>4. 최종 결과 미리보기</span>
            <button class="copy-btn copy-btn-alt" style="width: auto; padding: 5px 10px; margin: 0; font-size: 0.85rem;" onclick="copyResult()">결과 글자 복사</button>
        </label>
        <div id="result" class="result-box"></div>
    </div>
</div>

<script>
    function updateCounts() {
        const linksRaw = document.getElementById('linksInput').value;
        const links = linksRaw.split('\n').filter(link => link.trim().length > 0);
        document.getElementById('linkCount').textContent = links.length;

        const textRaw = document.getElementById('textInput').value;
        const totalChars = textRaw.length;
        const noSpaceChars = textRaw.replace(/\s/g, '').length;

        document.getElementById('textCount').textContent = totalChars;
        document.getElementById('textCountNoSpace').textContent = noSpaceChars;
    }

    function generateLinks() {
        const linksRaw = document.getElementById('linksInput').value;
        const textRaw = document.getElementById('textInput').value;
        const htmlSource = document.getElementById('htmlSource');
        const resultContainer = document.getElementById('result');

        const links = linksRaw.split('\n')
                              .map(link => link.trim())
                              .filter(link => link.length > 0);

        if (textRaw.length === 0) {
            htmlSource.value = '';
            resultContainer.innerHTML = '<span style="color:red; font-size:0.9rem;">텍스트를 입력해주세요.</span>';
            return;
        }

        let outputHTML = '';
        let linkIndex = 0;

        // 글자 단위와 뒤따르는 공백을 함께 그룹화하여 처리
        const matches = textRaw.match(/(\s+)|([^\s]\s*)/g) || [];

        matches.forEach(item => {
            // 문장 맨 앞에 오는 순수 공백 처리
            if (/^\s+$/.test(item)) {
                outputHTML += item;
            } else {
                // 글자(및 뒤따르는 띄어쓰기)에 링크 연결
                if (linkIndex < links.length) {
                    let url = links[linkIndex++];
                    if (!/^https?:\/\//i.test(url)) {
                        url = 'http://' + url;
                    }
                    outputHTML += `<a href="${url}" target="_blank">${item}</a>`;
                } else {
                    outputHTML += item;
                }
            }
        });

        htmlSource.value = outputHTML;
        resultContainer.innerHTML = outputHTML;
    }

    function renderFromSource() {
        const source = document.getElementById('htmlSource').value;
        document.getElementById('result').innerHTML = source;
    }

    function copyHtmlSource() {
        const htmlSource = document.getElementById('htmlSource');
        if (!htmlSource.value.trim()) {
            alert('복사할 HTML 소스가 없습니다.');
            return;
        }
        htmlSource.select();
        document.execCommand('copy');
        alert('HTML 소스가 복사되었습니다.');
    }

    function copyResult() {
        const resultContainer = document.getElementById('result');
        
        if (resultContainer.innerText.trim() === '' || resultContainer.innerText.includes('텍스트를 입력해주세요')) {
            alert('복사할 결과물이 없습니다.');
            return;
        }

        const range = document.createRange();
        range.selectNode(resultContainer);
        window.getSelection().removeAllRanges();
        window.getSelection().addRange(range);

        try {
            document.execCommand('copy');
            alert('결과 글자가 복사되었습니다.');
        } catch (err) {
            alert('복사에 실패했습니다.');
        }

        window.getSelection().removeAllRanges();
    }
</script>

</body>
</html>
